<!DOCTYPE html>
<html lang="az">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tools</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="wrapper">
    <h1>Tools</h1>
    <p class="note">Yalnız test və simulyasiya üçündür. Kamera və yer üçün brauzer icazəsi tələb olunacaq.</p>

    <div class="actions">
      <button id="startBtn">Başlat (Kamera + Yer + IP)</button>
      <button id="captureBtn" disabled>Şəkil çək</button>
      <button id="saveBtn" disabled>Məlumatları endir (JSON)</button>
      <button id="stopBtn" disabled class="stop">Dayandır</button>
    </div>

    <div class="preview">
      <video id="video" autoplay playsinline></video>
      <img id="photo" hidden>
    </div>

    <div class="data">
      <h3>Toplanan məlumatlar</h3>
      <pre id="output">Hələ heç nə yoxdur.</pre>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
